[project]
name = "voxcpm-media-studio"
version = "0.1.0"
description = "Offline Apple Silicon video transcription, speaker diarization, Khmer translation, and subtitle burn-in service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.32.0,<1.0.0",
  "python-multipart>=0.0.12,<1.0.0",
  "mlx-whisper>=0.4.0,<1.0.0",
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-core==1.13.8",
  "transformers>=4.46.0,<5.0.0",
  "sentencepiece>=0.2.0,<1.0.0",
  "torch>=2.5.0,<3.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
