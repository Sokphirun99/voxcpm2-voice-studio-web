name: voxcpm-voice-studio

services:
  storage:
    build:
      context: .
      target: storage
    environment:
      PORT: "8090"
      DATA_DIR: /data
    volumes:
      - voice_studio_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s

  studio:
    build:
      context: .
      target: prod
    depends_on:
      storage:
        condition: service_healthy
    ports:
      - "${VOICE_STUDIO_BIND:-0.0.0.0}:${VOICE_STUDIO_PORT:-8087}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s

volumes:
  voice_studio_data:
    name: voxcpm_voice_studio_data
